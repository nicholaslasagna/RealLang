<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Static, offline-safe RealForge Workbench interface prototype (legacy 0.4 shell)."
    />
    <title>RealForge Workbench Prototype (Legacy)</title>
    <link rel="icon" href="../assets/icons/command.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../styles.css" />
    <script defer src="./js/data-bundle.js"></script>
    <script defer src="../js/mock-data.js"></script>
    <script defer src="../js/components.js"></script>
    <script defer src="../js/app.js"></script>
  </head>
  <body>
    <div id="app" class="app-shell" data-screen="home">
      <header id="topbar" class="topbar" aria-label="Environment status"></header>
      <div class="app-body">
        <nav id="sidebar" class="sidebar" aria-label="RealForge sections"></nav>
        <main id="main" class="main-panel" tabindex="-1"></main>
      </div>
      <footer id="status-rail" class="status-rail" aria-label="Operation status"></footer>
    </div>

    <dialog id="command-palette" class="command-dialog" aria-labelledby="command-title">
      <div id="command-palette-content"></div>
    </dialog>
    <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>
  </body>
</html>
