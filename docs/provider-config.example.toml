# Example RealForge provider configuration — PUBLIC TEMPLATE ONLY
#
# Copy to ~/.realforge.local.toml in your user home directory.
# Do not commit ~/.realforge.local.toml.

[provider]
kind = "openai_compatible_local"
display_name = "Private Local Model"
model = "your-local-model-id"
base_url = "http://localhost:8000/v1"
# api_key = "<optional-local-placeholder>"
trust = "local_untrusted"

# Optional future private local image provider (metadata only; execution not enabled).
