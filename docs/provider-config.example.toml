# Example RealForge provider configuration — PUBLIC TEMPLATE ONLY
#
# Copy to .realforge.local.toml (gitignored) at your repository root.
# Do not commit .realforge.local.toml or .realforge.private.toml.
#
# Your local model identity stays in ignored local files, not this repository.
# All provider output remains UNTRUSTED until validated.

[model]
provider = "openai_compatible_local"
display_name = "Private Local Model"
model = "<configured-locally>"
base_url = "http://localhost:8000/v1"
# api_key = "<optional-local-placeholder>"
trust = "local_untrusted"

[model.trust]
output_untrusted = true
allow_cloud_endpoints = false
